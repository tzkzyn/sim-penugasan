services:
  postgres:
    image: postgres:16-alpine
    container_name: sim_penugasan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: sim_penugasan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sim_penugasan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

